app-id: io.github.dlippok.photometric-viewer
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: photometric-viewer
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

modules:
  - name: photometric-viewer
    buildsystem: simple
    build-commands:
      - INSTALL_TARGET=${FLATPAK_DEST} make install
    sources:
      - type: git
        url: "https://github.com/dlippok/photometric-viewer.git"
        tag: v3.6.0
        commit: 314d759cb94f63de32958bb12476e7c9716a3ff1
